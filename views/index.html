<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Applications</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Applications</h3>
        <button class="btn btn-primary" id="addApplication">
            + Add New
        </button>
    </div>

    <!-- Accordion -->
    <div class="accordion" id="applicationAccordion">

        <div class="accordion-item">
            <h2 class="accordion-header" id="headingOne">
                <button class="accordion-button" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseOne"
                        aria-expanded="true">
                    Application List
                </button>
            </h2>

            <div id="collapseOne"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#applicationAccordion">

                <div class="accordion-body">

                    <!-- Accordion header actions -->
                    <div class="d-flex justify-content-end mb-3">
                        <button class="btn btn-success btn-sm openModal">
                            + Add New
                        </button>
                    </div>

                    <!-- Table -->
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th width="150">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>1</td>
                            <td>App One</td>
                            <td>Web</td>
                            <td>
                                <span class="badge bg-success">Active</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-info openModal">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>App Two</td>
                            <td>API</td>
                            <td>
                                <span class="badge bg-secondary">Inactive</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-info openModal">Edit</button>
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </div>

    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="applicationModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Application Form</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="applicationForm">
                <div class="modal-body">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Application Name</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Application Type</label>
                            <select class="form-select">
                                <option>Web</option>
                                <option>API</option>
                                <option>Service</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Configuration (JSON)</label>
                        <textarea class="form-control"
                                  rows="5"
                                  placeholder='{"key":"value"}'></textarea>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="confirmCheck">
                        <label class="form-check-label" for="confirmCheck">
                            I confirm the information is correct
                        </label>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    $(function () {

        // Open modal
        $('.openModal, #addApplication').on('click', function () {
            $('#applicationModal').modal('show');
        });

        // Form submit
        $('#applicationForm').on('submit', function (e) {
            e.preventDefault();

            if (!$('#confirmCheck').is(':checked')) {
                alert('Please confirm before submitting.');
                return;
            }

            alert('Form submitted!');
            $('#applicationModal').modal('hide');
        });
    });
</script>

</body>
</html>
